<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo list</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>To-do list</h1>

        <!-- Statistics -->
        <div class="statistics-row">
          <div class="statistic-box">
            <p>Tasks:</p>
            <div class="statistic-value" id="tasks-total">#</div>
          </div>
          <div class="statistic-box">
            <p>Completed:</p>
            <div class="statistic-value" id="tasks-finished">#</div>
          </div>
          <div class="statistic-box">
            <p>Not completed:</p>
            <div class="statistic-value" id="tasks-uncompleted">#</div>
          </div>
        </div>
        <!-- Task input form -->
        <form class="task-form" action="">
          <button type="button" id="filter-all" class="filter">All</button>
          <button type="button" id="filter-pending" class="filter">
            Pending
          </button>
          <button type="button" id="filter-completed" class="filter">
            Completed
          </button>
          <input type="text" id="task-input" placeholder="Task name" />
          <button type="button" id="add-task-button">Add task</button>
        </form>
      </header>
      <main>
        <section>
          <h2 id="task-header">Tasks</h2>

          <!-- Task display -->
          <div class="task-display" id="task-display"></div>
        </section>
      </main>
      <footer>&copy; 2026 - Unnar Freyr Hlynsson</footer>
    </div>
  </body>
</html>
