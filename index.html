<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo list</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>To-do list</h1>

        <!-- Statistics -->
        <div class="statistics-row">
          <div class="statistic-box">
            <p>Tasks</p>
            <div class="statistic-value">2</div>
          </div>
          <div class="statistic-box">
            <p>Finished</p>
            <div class="statistic-value">3</div>
          </div>
          <div class="statistic-box">
            <p>Uncompleted</p>
            <div class="statistic-value">5</div>
          </div>
        </div>
        <!-- Task input form -->
        <form class="task-form" action="">
          <input type="text" id="task-input" placeholder="Task name" />
          <button type="submit">Add task</button>
        </form>
      </header>
      <main>
        <section>
          <h2>Tasks</h2>

          <!-- Task display -->
          <div class="task-display">
            <div class="task">
              <p class="task-name">
                Clean up room and do the laundry before dinner
              </p>
              <div class="task-buttons">
                <button>Completed</button>
                <button>Delete</button>
              </div>
            </div>
            <div class="task">
              <p class="task-name">
                Clean up room and do the laundry before dinner
              </p>
              <div class="task-buttons">
                <button>Completed</button>
                <button>Delete</button>
              </div>
            </div>
            <div class="task">
              <p class="task-name">
                Clean up room and do the laundry before dinner
              </p>
              <div class="task-buttons">
                <button>Completed</button>
                <button>Delete</button>
              </div>
            </div>
            <div class="task">
              <p class="task-name">
                Clean up room and do the laundry before dinner
              </p>
              <div class="task-buttons">
                <button>Completed</button>
                <button>Delete</button>
              </div>
            </div>
            <div class="task">
              <p class="task-name">
                Clean up room and do the laundry before dinner
              </p>
              <div class="task-buttons">
                <button>Completed</button>
                <button>Delete</button>
              </div>
            </div>
          </div>
        </section>
      </main>
      <footer></footer>
    </div>
  </body>
</html>
