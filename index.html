<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo list</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>To-do list</h1>

        <!-- Statistics -->
        <div class="statistics-row">
          <div class="statistic-box">
            <p>Tasks:</p>
            <div class="statistic-value" id="tasks-total">#</div>
          </div>
          <div class="statistic-box">
            <p>Completed:</p>
            <div class="statistic-value" id="tasks-finished">#</div>
          </div>
          <div class="statistic-box">
            <p>Not completed:</p>
            <div class="statistic-value" id="tasks-uncompleted">#</div>
          </div>
        </div>
        <!-- Task input form -->
        <form class="task-form" action="">
          <input type="text" id="task-input" placeholder="Task name" />
          <button type="button" id="add-task-button">Add task</button>
        </form>
      </header>
      <main>
        <section>
          <h2>Tasks</h2>

          <!-- Task display -->
          <div class="task-display" id="task-display"></div>
        </section>
      </main>
      <footer>&copy; 2026 - Unnar Freyr Hlynsson</footer>
    </div>
  </body>
</html>
